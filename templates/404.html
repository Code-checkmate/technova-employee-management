{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="metric-icon-wrap bg-warning-subtle text-warning mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-file-earmark-x"></i>
        </div>
        <h2 class="h3 fw-bold text-dark mb-2">Record or Page Not Found</h2>
        <p class="text-muted mb-4">
            The requested employee record or endpoint does not exist in the TechNova database or may have been removed.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-navy">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
            <a href="{{ url_for('employee_list') }}" class="btn btn-outline-secondary">
                <i class="bi bi-people me-1"></i> Browse Directory
            </a>
        </div>
    </div>
</div>
{% endblock %}
