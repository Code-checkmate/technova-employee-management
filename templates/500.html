{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="metric-icon-wrap bg-danger-subtle text-danger mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h2 class="h3 fw-bold text-dark mb-2">Internal Server Error</h2>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Internal system traces and database credentials are held securely and have not been exposed.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-navy">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
            <a href="{{ url_for('database_status') }}" class="btn btn-outline-secondary">
                <i class="bi bi-database-check me-1"></i> Check DB Connectivity
            </a>
        </div>
    </div>
</div>
{% endblock %}
